# TypeScript types generated from this store's Go wire types. The Go structs
# are the source of truth; ts/ is a render of them. Regenerate with
# ./generate-ts.sh after changing a wire type. Only entry.go and vocabulary.go
# hold wire types; the rest are the store, the server and its clients.
packages:
  - path: "github.com/kayushkin/journal-store"
    output_path: "ts/model.ts"
    type_mappings:
      "json.RawMessage": "unknown"
      "time.Time": "string"
    exclude_files:
      - "store.go"
      - "entry_store.go"
      - "timeline_store.go"
      - "registry.go"
      - "noteboard.go"
      - "markdown.go"
      - "server.go"
      - "settings.go"
      - "schema_embed.go"
